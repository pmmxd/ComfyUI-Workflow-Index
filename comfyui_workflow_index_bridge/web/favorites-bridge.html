<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Workflow Favorites Bridge</title>
</head>
<body>
  <script>
    const LOOPBACK_HOSTS = new Set(["127.0.0.1", "localhost", "::1"]);
    const REQUEST_TYPE = "dapao:favorites-request";
    const RESPONSE_TYPE = "dapao:favorites-response";

    function isLoopbackOrigin(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) && LOOPBACK_HOSTS.has(url.hostname);
      } catch {
        return false;
      }
    }

    async function requestFavorites(action, payload) {
      const options = { cache: "no-store" };
      if (action === "save") {
        options.method = "POST";
        options.headers = { "Content-Type": "application/json" };
        options.body = JSON.stringify(payload || {});
      }
      const response = await fetch("/dapao/workflow-favorites", options);
      const data = await response.json();
      if (!response.ok) throw new Error(data?.error || `HTTP ${response.status}`);
      return data;
    }

    window.addEventListener("message", async (event) => {
      if (!isLoopbackOrigin(event.origin)) return;
      if (!event.data || event.data.type !== REQUEST_TYPE || !event.source) return;
      const { id, action, payload } = event.data;
      try {
        const data = await requestFavorites(action, payload);
        event.source.postMessage(
          { type: RESPONSE_TYPE, id, ok: true, data },
          event.origin,
        );
      } catch (error) {
        event.source.postMessage(
          { type: RESPONSE_TYPE, id, ok: false, error: error instanceof Error ? error.message : String(error) },
          event.origin,
        );
      }
    });
  </script>
</body>
</html>
